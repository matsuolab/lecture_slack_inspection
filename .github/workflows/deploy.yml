name: Manual Deploy (CD)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: CDK Deploy
        run: |
          npx aws-cdk@2 deploy --all --require-approval never \
            --parameters NotionDbId="${{ secrets.NOTION_DB_ID }}" \
            --parameters NotionTemplateDbId="${{ secrets.NOTION_TEMPLATE_DB_ID }}" \
            --parameters NotionArticlesDbId="${{ secrets.NOTION_ARTICLES_DB_ID }}" \
            --parameters NotionHealthDbId="${{ secrets.NOTION_HEALTH_DB_ID }}" \
            --parameters OpenAIModel="${{ vars.OPENAI_MODEL }}" \
            --parameters OpenAIEmbeddingModel="${{ vars.OPENAI_EMBEDDING_MODEL }}" \
            --parameters GuidelinesText="${{ vars.GUIDELINES_TEXT }}" \
            --parameters MinSeverityToAlert="${{ vars.MIN_SEVERITY_TO_ALERT }}"