description: slack inspection - step3 LLM judge eval

providers:
  - id: openai:chat:gpt-4o-mini
    label: gpt-4o-mini
    config:
      temperature: 0
      response_format: file://../../lambda/app_inspect/services/data/prompts/judge_violation.response_format.json

  # gpt-5.6-luna は reasoning モデルのため temperature 非対応（渡すと 400 Bad Request）。
  # 代わりに reasoning_effort で挙動を制御する。既存の gpt-4o-mini と公平に比較するため
  # デフォルト値の "medium" を明示指定。
  - id: openai:chat:gpt-5.6-luna
    label: gpt-5.6-luna
    config:
      reasoning_effort: medium
      response_format: file://../../lambda/app_inspect/services/data/prompts/judge_violation.response_format.json

prompts:
  - id: file://../../lambda/app_inspect/services/data/prompts/judge_violation.txt
    label: judge_violation

defaultTest:
  options:
    transform: JSON.parse(output)
  assert:
    - type: javascript
      metric: Detection
      value: |
        const output_isViolation = output.violation_score >= 51 ? 1 : 0;
        const isCorrect = output_isViolation === context.vars.expected_is_violation;
        return {
          pass: isCorrect, 
          score: isCorrect ? 1.0 : 0.0,
          reason: `Detection - Expected: ${context.vars.expected_is_violation}, Got: ${output_isViolation}`
        };

    - type: javascript
      metric: Article
      weight: 0
      value: |
        const expectedIsViolation = context.vars.expected_is_violation;
        const expectedArticle = context.vars.expected_violating_article || '';
        const gotArticle = output.article_id || '';
        let isCorrect = false;
        let reason = '';
        
        if (expectedIsViolation) {
          isCorrect = String(expectedArticle) === String(gotArticle);
          reason = isCorrect ? 'Match' : `Expected: ${expectedArticle}, Got: ${gotArticle}`;
        } else {
          isCorrect = true;
          reason = 'Ignored (Non-violation case)';
        }
        
        return {
          pass: true, 
          score: isCorrect ? 1.0 : 0.0,
          reason: `Article Check - ${reason}`
        };

    - type: javascript
      metric: confidence
      weight: 0 
      value: |
        const output_isViolation = output.violation_score >= 51 ? 1 : 0;
        const isViolationCorrect = output_isViolation === context.vars.expected_is_violation;
        const confidence = output.confidence ?? 0;
        const degree = context.vars.degree;
        let score, reason;
        
        if (isViolationCorrect) {
          score = degree === '明確な違反'
            ? (confidence >= 0.8 ? 1.0 : confidence >= 0.6 ? 0.7 : 0.3)
            : (confidence >= 0.5 ? 1.0 : 0.5);
          reason = `correct, confidence=${confidence} (${degree})`;
        } else {
          score = Math.max(0, 1.0 - confidence);
          reason = `wrong prediction, confidence=${confidence} (overconfidence penalty)`;
        }
        
        return { 
          pass: true, 
          score, 
          reason 
        };

tests:
  - file://datasets/testcases_preview.yaml
