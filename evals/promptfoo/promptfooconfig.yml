# Slack 監視 App の違反検知の評価（本番の判定のコード ViolationDetector をそのまま呼ぶ）
# 使い方は evals/README.md。データセットは load_dataset.py で datasets/testcases.yaml に変換してから使う
description: slack inspection - ViolationDetector eval (PJT04 dataset)

providers:
  - id: file://provider.py
    label: decisions
    config:
      mode: decisions   # decisions（新方式）／luna（予備経路だけ）／llm_score（旧方式）
      # model: gpt-6-luna   # 省略時は mode ごとの既定
      workers: 4         # 同時に判定する数。スロットリングが出たら下げる
      # prompts_from_head: true   # プロンプトを git の HEAD の版から読む（既定は作業ツリーの版）

# 投稿の本文をそのままプロバイダーに渡す
prompts:
  - "{{text}}"

defaultTest:
  assert:
    # 合否: 違反かどうかの一致。判定の失敗は不合格にし、理由に「判定の失敗」と書く（集計では取りこぼしと分ける）
    - type: javascript
      metric: Detection
      value: |
        if (output.error) {
          return { pass: false, score: 0, reason: `判定の失敗: ${output.error}` };
        }
        const ok = output.is_violation === context.vars.expected_is_violation;
        return { pass: ok, score: ok ? 1 : 0,
                 reason: `expected=${context.vars.expected_is_violation} got=${output.is_violation} (${output.method})` };
    # 参考: 条文の一致（正しく警告したものだけを見る。合否には入れない）
    - type: javascript
      metric: Article
      weight: 0
      value: |
        if (output.error || !context.vars.expected_is_violation || !output.is_violation) {
          return { pass: true, score: 1, reason: '対象外' };
        }
        const ok = output.article_id === context.vars.expected_article;
        return { pass: true, score: ok ? 1 : 0,
                 reason: `expected=${context.vars.expected_article} got=${output.article_id}` };

tests:
  - file://datasets/testcases.yaml
