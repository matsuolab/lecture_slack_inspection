      const confidence = output.confidence ?? 0;\nconst degree = context.vars.degree;\n\
      let score, reason;\nif (isViolationCorrect) {\n  score = degree === '明確な違反'\n\
      \    ? (confidence >= 0.8 ? 1.0 : confidence >= 0.6 ? 0.7 : 0.3)\n    : (confidence\
      \ >= 0.5 ? 1.0 : 0.5);\n  reason = `correct, confidence=${confidence} (${degree})`;\n\
      } else {\n  score = Math.max(0, 1.0 - confidence);\n  reason = `wrong prediction,\
      \ confidence=${confidence} (overconfidence penalty)`;\n}\nreturn { pass: true,\
      \ score, reason };"
